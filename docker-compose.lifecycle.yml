services:
  external-services:
    environment:
      STATION_CALLBACK_TOKEN: ${STATION_CALLBACK_TOKEN:?Set a station callback token}
  migrate:
    build:
      context: .
      dockerfile: app/lifecycle/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_MIGRATIONS_URL: postgresql+psycopg://rental:rental@postgres:5432/rental
    depends_on:
      postgres:
        condition: service_healthy
  rental-api:
    build:
      context: .
      dockerfile: app/lifecycle/Dockerfile
    expose:
      - "8000"
    environment: &lifecycle-env
      DATABASE_URL: postgresql+asyncpg://rental:rental@postgres:5432/rental
      REDIS_URL: redis://redis:6379/0
      EXTERNAL_SERVICES_URL: http://external-services:3629
      STATION_CALLBACK_TOKEN: ${STATION_CALLBACK_TOKEN:?Set a station callback token}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-2}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-200}
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-0.2}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-0.2}
      RENTAL_DATABASE_FALLBACK_MAX_CONCURRENCY: ${RENTAL_DATABASE_FALLBACK_MAX_CONCURRENCY:-100}
      RENTAL_DATABASE_FALLBACK_TIMEOUT_SECONDS: ${RENTAL_DATABASE_FALLBACK_TIMEOUT_SECONDS:-0.05}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      external-services:
        condition: service_started
    restart: on-failure
    deploy:
      replicas: ${RENTAL_API_REPLICAS:-7}
  load-balancer:
    image: nginx:1.27-alpine
    ports:
      - "8000:8080"
    volumes:
      - ./nginx/rental-api.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      rental-api:
        condition: service_started
    restart: on-failure
  lifecycle-worker:
    build:
      context: .
      dockerfile: app/lifecycle/Dockerfile
    command: ["python", "-m", "app.lifecycle.worker"]
    environment: *lifecycle-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      external-services:
        condition: service_started
    restart: on-failure
