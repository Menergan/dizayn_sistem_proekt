services:
  external-services:
    build:
      context: .
      dockerfile: external_services/Dockerfile
    ports:
      - "3629:3629"
    environment:
      RENTAL_CALLBACK_URL: ${RENTAL_CALLBACK_URL:-http://rental-api:8000/station-events/powerbank-returned}
      EMULATOR_TIMEOUT_SECONDS: ${EMULATOR_TIMEOUT_SECONDS:-3}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rental}
      POSTGRES_USER: ${POSTGRES_USER:-rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rental}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
